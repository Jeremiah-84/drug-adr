name: 성분 짧은 소개 만들기 (약의 역사 작은 점)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 식약처 허가정보에서 약효 분류·효능효과 받기
        env:
          MFDS_KEY: ${{ secrets.MFDS_KEY }}
        run: python3 pipeline/brief.py --out docs/data --cache .cache --budget 75
      - name: 올리기
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add docs/data/brief.json
          git diff --cached --quiet || git commit -m "성분 짧은 소개 갱신 $(date +%Y-%m-%d)"
          git pull --rebase origin main && git push
