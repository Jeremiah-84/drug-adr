name: 약 데이터 매월 갱신
on:
  schedule:
    - cron: "0 18 1 * *"   # 매월 2일 03:00 (한국 시간)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 식약처 데이터 받기와 추출
        env:
          MFDS_KEY: ${{ secrets.MFDS_KEY }}
        run: |
          python3 pipeline/barcodes.py --cache .cache
          python3 pipeline/pills.py --cache .cache
          python3 pipeline/run.py --out docs/data --cache .cache
          python3 pipeline/history_kr.py --out docs/data --cache .cache
          python3 pipeline/brief.py --out docs/data --cache .cache
      - name: 바뀐 데이터 올리기
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add docs/data pipeline/barcodes.json
          git diff --cached --quiet || git commit -m "약 데이터 갱신 $(date +%Y-%m-%d)"
          git pull --rebase origin main && git push
