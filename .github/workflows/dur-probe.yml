name: DUR 원자료 시험 받기 (임시)
on:
  push:
    branches: ["claude/project-thread-oe9r1a"]
    paths: [".github/workflows/dur-probe.yml", "pipeline/dur.py", "pipeline/dur_build.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          MFDS_KEY: ${{ secrets.MFDS_KEY }}
        run: python3 pipeline/dur.py --fetch --out docs/data
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add pipeline/dur_raw.json docs/data/interactions.json
          git commit -m "DUR 원자료 시험 받기" && git push
