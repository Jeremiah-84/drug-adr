<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>약 사전 · 약 바로알기</title>
<meta name="description" content="식약처 허가정보 기준 약 사전. 성분과 제품별 이상반응, 신장·간 주의 사항.">
<meta name="theme-color" content="#0e7a63">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="portal.css">
</head>
<body data-page="drug" data-base="">
<section class="page-head"><div class="wrap">
  <div class="crumb" id="crumb"><a href="index.html">홈</a> / 약 사전</div>
  <h1 id="title">약 사전</h1>
  <p class="lead" id="lead">제품명이나 성분명으로 찾아보세요. 식약처 첨부문서에 적힌 이상반응을 가능성 단계로 보여드려요.</p>
  <div class="search compact">
    <div class="box"><i data-i="search"></i><input id="q" type="search" placeholder="예: 타이레놀, 판콜, 로수바스타틴" autocomplete="off" aria-label="약 검색"><button class="btn" type="button"><span>검색</span></button></div>
    <div class="sugg" id="sugg" hidden></div>
  </div>
</div></section>
<main><div class="wrap"><div id="out"></div></div></main>
<script src="portal.js"></script>
<script>
const {esc,DATA,load,icon,DEP_IDS,depLines}=Portal;
const out=document.getElementById('out'),T=document.getElementById('title'),L=document.getElementById('lead'),C=document.getElementById('crumb');
const LV={4:'높음',3:'가능성 있음',2:'낮음',1:'매우 드묾'};
const LVTXT={4:'흔하게 보고됨',3:'보고된 적 있음 · 빈도 정보가 없거나 때때로',2:'드물게 보고됨',1:'매우 드물게 보고됨'};
const ORG={'금기':'이 약을 쓰면 안 되는 경우가 있어요','용량 조절':'양을 줄이거나 간격을 늘려야 할 수 있어요','주의':'주의해서 써야 해요','조절 불필요':'대개 양을 바꿀 필요가 없어요'};
const nedrug=seq=>`https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=${seq}`;
Portal.attachSearch(document.getElementById('q'),document.getElementById('sugg'),it=>{
  const u=it.type==='product'?'?p='+encodeURIComponent(it.label):'?id='+encodeURIComponent(it.ids[0]);
  history.pushState(null,'',u);document.getElementById('q').value='';route();
});
addEventListener('popstate',route);
route();
const head=(t,lead,crumb)=>{T.textContent=t;L.innerHTML=lead;C.innerHTML=`<a href="index.html">홈</a> / <a href="drug.html">약 사전</a>${crumb?' / '+esc(crumb):''}`};

async function route(){
  const sp=new URLSearchParams(location.search);
  if(sp.get('id'))return showDrug(sp.get('id'));
  if(sp.get('p'))return showProduct(sp.get('p'));
  T.textContent='약 사전';C.innerHTML='<a href="index.html">홈</a> / 약 사전';
  out.innerHTML=`<div class="grid two">
    <div class="card"><span class="eyebrow">${icon('info')}이렇게 읽어요</span>
      <ul class="clean" style="margin-top:8px">
      <li><span class="lv lv4">높음</span><span>흔하게 보고된 이상반응</span></li>
      <li><span class="lv lv3">가능성 있음</span><span>보고된 적 있음 (빈도 정보 없음·때때로)</span></li>
      <li><span class="lv lv2">낮음</span><span>드물게 보고됨</span></li>
      <li><span class="lv lv1">매우 드묾</span><span>매우 드물게 보고됨</span></li></ul></div>
    <div class="card"><span class="eyebrow">${icon('doc')}자료 기준</span><p style="color:var(--muted);margin:8px 0 0">성분마다 대표 제품 1개의 식약처 첨부문서를 골라 정리했어요. 같은 성분이라도 제품에 따라 문구가 조금 다를 수 있어요. 모든 항목에 근거 문장과 원문 링크가 있어요.</p></div>
  </div>`;
}
async function showProduct(name){
  const db=await load();const ids=db.d.products[name];
  if(!ids){out.innerHTML='<div class="empty">제품을 찾지 못했어요.</div>';return}
  if(ids.length===1&&db.byId[ids[0]])return showDrug(ids[0],name);
  document.title=name+' · 약 바로알기';
  head(name,`이 제품에는 성분이 <b>${ids.length}가지</b> 들어 있어요. 성분을 눌러 이상반응을 확인하세요.`,name);
  out.innerHTML=`<div class="grid">${ids.map(id=>{const x=db.byId[id];return x?`<a class="tile" href="?id=${encodeURIComponent(id)}"><span class="ico">${icon('pill')}</span>${icon('arrow')}<b>${esc(x.ko||x.en)}</b><span>${esc(x.en)}</span></a>`:`<div class="tile"><b>${esc(id)}</b><span>아직 사전에 없는 성분이에요</span></div>`}).join('')}</div>
  <div class="note" style="margin-top:24px">${icon('layers')}<span>다른 감기약·진통제와 같이 먹을 생각이라면 <a href="check.html?items=${encodeURIComponent(name)}">성분이 겹치는지 확인</a>해 보세요.</span></div>`;
}
async function showDrug(id,fromProduct){
  const db=await load();const x=db.byId[id];
  if(!x){out.innerHTML='<div class="empty">이 성분은 아직 사전에 없어요.</div>';return}
  const nm=x.ko||x.en;
  document.title=nm+' 이상반응과 주의사항 · 약 바로알기';
  head(nm,`${esc(x.en)}${(x.form||[]).map(f=>` <span class="badge">${esc(f)}</span>`).join('')}${fromProduct?` · <b>${esc(fromProduct)}</b>의 성분`:''}`,nm);
  out.innerHTML='<div class="card"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="margin-top:12px"></div><div class="skeleton" style="margin-top:12px;width:70%"></div></div>';
  let r;try{r=await fetch(DATA+'d/'+x.f+'.json').then(r=>r.json())}catch(e){out.innerHTML='<div class="empty">자료를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>';return}
  const groups={4:[],3:[],2:[],1:[]};
  for(const [pid,[lv,freq,q]] of Object.entries(r.adr||{})){const p=db.probs[pid];(groups[lv]||groups[3]).push({name:p?p.name:pid,cat:p?p.category:'',freq,q})}
  const same=db.prods.filter(p=>p.ids.length===1&&p.ids[0]===id).map(p=>p.name);
  const combo=db.prods.filter(p=>p.ids.length>1&&p.ids.includes(id)).length;
  const organ=r.organ||{};
  const badge=t=>`<span class="badge ${t.split(' ')[0]}">${esc(t)}</span>`;
  const orgCard=(k,label)=>{const o=organ[k];
    if(!o||!o.t||!o.t.length)return`<div class="card"><div class="t">${label}</div><span style="color:var(--muted);font-size:.92rem">첨부문서에 따로 적힌 내용을 찾지 못했어요</span></div>`;
    return`<div class="card"><div class="t">${label} ${o.t.map(badge).join(' ')}</div><span style="font-size:.95rem">${o.t.map(t=>esc(ORG[t]||'')).join(' ')}</span>${(o.e||[]).slice(0,2).map(e=>`<div class="q">“${esc(e[1])}”</div>`).join('')}</div>`};
  const date=r.date?`${r.date.slice(0,4)}.${r.date.slice(4,6)}.${r.date.slice(6,8)}`:'';
  const total=Object.values(groups).reduce((a,b)=>a+b.length,0);
  const dl=DEP_IDS.has(id)?depLines(r.txt):[];
  const dep=DEP_IDS.has(id)?`<div class="note" style="margin-top:12px">${icon('warn')}<div><b>의존성 주의</b> <span class="tag draft">감수 중</span><div style="margin-top:4px">오래 먹으면 내성이나 의존이 생길 수 있는 약이에요. 처방받은 양과 기간을 지키고, 줄이거나 끊을 때는 스스로 갑자기 끊지 말고 처방한 의사와 먼저 상의하세요.</div>${dl.slice(0,2).map(t=>`<div class="q">“${esc(t.length>200?t.slice(0,200)+'…':t)}”</div>`).join('')}<a href="dependence.html" style="font-size:.88rem;display:inline-block;margin-top:6px">의존·중독 안내 보기 →</a></div></div>`:'';
  out.innerHTML=`<div class="layout"><div>
  <div class="alert">${icon('info')}<span>이상반응 목록은 "이런 일이 보고된 적이 있다"는 뜻이지, 누구에게나 생긴다는 뜻이 아니에요. 걱정되는 증상이 있어도 약을 스스로 끊지 말고 의사·약사와 먼저 상의하세요.</span></div>${dep}
  <h2 style="margin-top:32px">이상반응 <span style="color:var(--muted);font-weight:500;font-size:1rem">${total}개</span></h2>
  ${[4,3,2,1].filter(l=>groups[l].length).map(l=>`<div class="lvhead"><span class="lv lv${l}">${LV[l]}</span><small>${LVTXT[l]}</small><span class="cnt">${groups[l].length}개</span></div>
  <ul class="adr">${groups[l].map(a=>`<li><b>${esc(a.name)}</b><span class="cat">${esc(a.cat)}</span><div class="q">“${esc(a.q)}”</div></li>`).join('')}</ul>`).join('')||'<div class="empty">정리된 이상반응이 없어요. 원문을 확인해 주세요.</div>'}
  <h2 style="margin-top:40px">신장·간이 약한 분</h2>
  <p style="color:var(--muted);margin:0 0 14px;font-size:.94rem">첨부문서의 신장·간 관련 문장을 정리했어요.</p>
  <div class="organ">${orgCard('renal','신장')}${orgCard('hepatic','간')}</div>
  <p style="color:var(--muted);font-size:.85rem;margin-top:28px">첨부문서 문장을 규칙에 따라 자동으로 분류한 결과라 빠지거나 잘못 분류된 항목이 있을 수 있어요. 정확한 내용은 식약처 원문을 확인하세요. <a href="about.html#report">오류 신고</a></p>
  </div>
  <aside>
    <div class="card"><span class="eyebrow">${icon('doc')}기준 문서</span>
      <div style="font-weight:600;margin:8px 0 2px;line-height:1.5">${esc(r.product)}</div>
      <div style="color:var(--muted);font-size:.86rem">${date?`식약처 변경일 ${date}`:''}</div>
      <a class="btn ghost" style="margin-top:14px;width:100%" href="${nedrug(r.seq)}" target="_blank" rel="noopener">식약처 원문 보기 ${icon('ext')}</a></div>
    <div class="card"><span class="eyebrow">${icon('pill')}같은 성분 제품</span>
      <div style="font-size:.92rem;margin-top:8px;color:var(--ink2)">${same.length?esc(same.slice(0,10).join(', '))+(same.length>10?` <span style="color:var(--muted)">외 ${same.length-10}개</span>`:''):'—'}</div>
      ${combo?`<div style="color:var(--muted);font-size:.85rem;margin-top:6px">이 성분이 든 복합제 ${combo}개</div>`:''}</div>
    <a class="tile" href="../"><span class="ico">${icon('symptom')}</span>${icon('arrow')}<b>이 증상, 이 약 때문일까?</b><span>먹는 약을 모두 넣고 증상으로 찾기</span></a>
    <a class="tile" href="check.html"><span class="ico">${icon('layers')}</span>${icon('arrow')}<b>같이 먹어도 되나요?</b><span>다른 약과 성분이 겹치는지 확인</span></a>
  </aside></div>`;
  scrollTo({top:0});
}
</script>
</body>
</html>
