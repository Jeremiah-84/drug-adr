<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고</title>
<style>
:root{--bg:#ffffff;--fg:#1d2622;--muted:#5d6a64;--line:#d9dfdb;--accent:#1f6f5c;--soft:#eef5f2}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#1a211e;--fg:#e6ece9;--muted:#9aa8a1;--line:#2f3a35;--accent:#5fc0a2;--soft:#223029;color-scheme:dark}}
:root.dark{--bg:#1a211e;--fg:#e6ece9;--muted:#9aa8a1;--line:#2f3a35;--accent:#5fc0a2;--soft:#223029;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a.slot{box-sizing:border-box;height:100%;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:10px;padding:8px 12px;color:inherit;text-decoration:none;background:var(--soft)}
.slot .ic{flex:none;width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px}
.slot b{display:block;font-size:14px}.slot span{color:var(--muted)}
.tag{position:fixed;right:6px;top:2px;font-size:9px;color:var(--muted);background:var(--bg);padding:0 3px;border-radius:3px}
</style>
<script>/* ?theme=light|dark — the phone app has its own light/dark switch */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.className=t})();</script></head><body>
<!-- 광고 자리: 어떤 광고를 낼지는 같은 폴더의 ads.json 하나로 정합니다 (확장 프로그램을 다시 배포할 필요 없음).
     provider: "test"(시험 배너) | "banner"(직접 계약 배너, banners 목록) | "adfit"(카카오 애드핏 광고단위 ID) | "coupang"(쿠팡 파트너스 다이나믹 배너)
     이 페이지는 확장 프로그램과 다른 주소에서 열려 처방 화면이나 입력한 약 정보에 접근할 수 없습니다. -->
<div id="box" style="height:100%"></div><span class="tag" id="tag">광고</span>
<script>
const box=document.getElementById('box'), tag=document.getElementById('tag');
const tell=(t,id)=>{try{parent.postMessage({adr:t,ad:id},'*')}catch(e){}};
function house(list,label){
  const ad=list[Math.floor(Math.random()*list.length)];
  const a=document.createElement('a');a.className='slot';a.target='_blank';a.rel='noopener sponsored';a.href=ad.url;
  a.innerHTML=ad.img?`<img src="${ad.img}" alt="" style="max-height:100%;max-width:100%">`:`<span class="ic"></span><span><b></b><span></span></span>`;
  if(!ad.img){a.querySelector('.ic').textContent=ad.icon||'AD';a.querySelector('b').textContent=ad.title;a.querySelector('span span').textContent=ad.sub||''}
  box.appendChild(a);tag.textContent=label;tell('ad_view',ad.id);a.addEventListener('click',()=>tell('ad_click',ad.id));
}
function script(src,after){const s=document.createElement('script');s.src=src;s.async=true;if(after)s.onload=after;document.body.appendChild(s)}
fetch('ads.json',{cache:'no-cache'}).then(r=>r.json()).then(c=>{
  if(c.provider==='adfit'&&c.adfit&&c.adfit.unit){
    box.innerHTML=`<ins class="kakao_ad_area" style="display:none" data-ad-unit="${c.adfit.unit}" data-ad-width="${c.adfit.width}" data-ad-height="${c.adfit.height}"></ins>`;
    box.style.cssText='height:100%;display:flex;justify-content:center;align-items:center';
    script('https://t1.daumcdn.net/kas/static/ba.min.js');tell('ad_view','adfit');
  }else if(c.provider==='coupang'&&c.coupang&&c.coupang.id){
    box.style.cssText='height:100%;display:flex;justify-content:center;align-items:center';
    // 쿠팡이 준 코드를 그대로 작은 틀 안에서 실행 (쿠팡 스크립트는 자기 자리에 배너를 직접 그림)
    const cfg={id:c.coupang.id,template:c.coupang.template||'carousel',trackingCode:c.coupang.trackingCode,width:String(c.coupang.width),height:String(c.coupang.height),tsource:''};
    const f=document.createElement('iframe');f.width=c.coupang.width;f.height=c.coupang.height;f.style.border='0';f.scrolling='no';f.title='광고';
    f.srcdoc='<!doctype html><html><body style="margin:0;overflow:hidden"><scr'+'ipt src="https://ads-partners.coupang.com/g.js"></scr'+'ipt><scr'+'ipt>new PartnersCoupang.G('+JSON.stringify(cfg)+');</scr'+'ipt></body></html>';
    box.appendChild(f);
    tag.textContent='이 광고는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.';tag.style.cssText='position:fixed;left:0;right:0;bottom:2px;top:auto;text-align:center;font-size:9px;color:var(--muted)';box.style.height='calc(100% - 14px)';tell('ad_view','coupang');
  }else{house(c.banners&&c.banners.length?c.banners:[{id:'none',title:'광고 자리',url:'#'}],c.provider==='banner'?'광고':'시험 광고')}
}).catch(()=>house([{id:'none',icon:'AD',title:'이 자리에 광고를 실을 수 있습니다',url:'https://github.com/Jeremiah-84/drug-adr/issues'}],'광고'));
</script>
</body></html>
