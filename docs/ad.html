<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고</title>
<style>
:root{--bg:#ffffff;--fg:#1d2622;--muted:#5d6a64;--line:#d9dfdb;--accent:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#1a211e;--fg:#e6ece9;--muted:#9aa8a1;--line:#2f3a35;--accent:#5fc0a2;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.slot{box-sizing:border-box;height:100%;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;padding:8px}
.slot b{font-size:14px}.slot span{color:var(--muted)}a{color:var(--accent)}
</style></head><body>
<!-- 광고 자리: 직접 판매 배너는 아래 slot 내용을 이미지/링크로 바꾸면 됩니다.
     구글 애드센스를 쓸 경우 승인 후 발급받은 코드를 이 파일에 넣으세요.
     이 페이지는 확장 프로그램과 다른 주소에서 열리므로 처방 화면 내용에 접근할 수 없습니다. -->
<div class="slot"><b>이 자리에 광고를 실을 수 있습니다</b><span>의사 대상 서비스 · 광고 문의는 GitHub 저장소 이슈로 남겨주세요</span></div>
</body></html>
